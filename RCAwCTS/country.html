<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="country.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet"/>

    <title>Project 1 | Option 3 | REST Countries API</title>

  <body>
    <header>
      <h1>Where in the world?</h1>

      <!-- Dark Mode Toggle -->
      <button id="themeToggle">🌙 Dark Mode</button>
    </header>

    <!-- Search for a country box -->
    <section class="controls">
      <button id="backBtn">⇦ Back</button>
    </section>

    <main id="countryDetails" class="countryDetails">
      <!-- Detailed country information with:
        Flag image | Name
        Native Name | Population | Region | Sub Region | Capital
        Top Level Domain | Currencies | Languages
        Border Countries -->
    </main>

    <footer>
      Built with data from
      <a href="https://restcountries.com/">REST Countries API</a>

      &copy; 2026 Coded by
      <a href="https://github.com/agross705">agross705</a>.
    </footer>

    <script src="country.js"></script>
    <script src="theme.js"></script>
  </body>
</html>
